[package]
name = "nila-senior"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Senior: a guarantee pool only (23 Nov). USDC stays here, grows by the vouchers' guarantee fee, pays only loss cover."

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
nila-common = { workspace = true }
nila-math = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[features]
# Demo builds only: a 60-second upgrade timelock (in-place upgrades keep the demo state). Never for mainnet.
demo-upgrade-delay = []
