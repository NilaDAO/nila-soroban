[package]
name = "nila-senior"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Senior investors' USDC: deposits at the fix, exits at par, interest paid in USDC by a union's LP (2 Nov)."

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
nila-common = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[features]
# Demo builds only: a 60-second upgrade timelock (in-place upgrades keep the demo state). Never for mainnet.
demo-upgrade-delay = []
