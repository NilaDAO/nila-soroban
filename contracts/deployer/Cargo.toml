[package]
name = "nila-deployer"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "One for all unions, immutable: deploys each member's own Nila account at the address that follows from the key (3 Nov)."

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
nila-common = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
nila-account = { path = "../account" }
