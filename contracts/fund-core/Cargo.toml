[package]
name = "nila-fund-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "nIN-only lending facility: deposits, tranches, loans, waterfall (GenericFundCore port)."

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
nila-math = { workspace = true }
nila-common = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
nila-roles = { path = "../roles" }
nila-land-title = { path = "../land-title" }
nila-fx-pool = { path = "../fx-pool" }
nila-machinery = { path = "../machinery" }
ed25519-dalek = { version = "2.2.0", default-features = false }

[features]
# One day = one second, so a testnet rehearsal reaches the payback date. Never for mainnet.
testnet-short-windows = []
