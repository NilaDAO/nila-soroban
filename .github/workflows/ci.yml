name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
          targets: wasm32v1-none
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Wasm
        run: cargo build --release --target wasm32v1-none
      - name: Wasm size gate (128 KiB)
        run: |
          set -e
          for f in target/wasm32v1-none/release/*.wasm; do
            size=$(wc -c < "$f")
            echo "$(basename "$f") $size bytes"
            if [ "$size" -gt 131072 ]; then
              echo "exceeds 128KiB contract limit"
              exit 1
            fi
          done
      - name: No testnet-short build in release wasm
        run: |
          if LC_ALL=C grep -a -l "testnet-short" target/wasm32v1-none/release/*.wasm; then
            echo "a wasm built with testnet-short-windows (one day = one second) must never ship"
            exit 1
          fi
