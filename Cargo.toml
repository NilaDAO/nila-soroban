[workspace]
resolver = "2"
members = [
    "contracts/nila-math",
    "contracts/nila-common",
    "contracts/land-title",
    "contracts/roles",
    "contracts/fund-core",
    "contracts/fund-viewer",
    "contracts/fx-pool",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Nila / Blockchainforcommons"]
repository = "https://github.com/NilaDAO/nila-contracts"
rust-version = "1.84"

[workspace.dependencies]
soroban-sdk = "27.0.2"
nila-math = { path = "contracts/nila-math" }
nila-common = { path = "contracts/nila-common" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
